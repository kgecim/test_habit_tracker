<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habits</title>
<style>
:root{color-scheme:dark;--bg:#100d16;--panel:#191321;--line:#382640;--text:#f6eff8;--muted:#a99bad;--pink:#f18acb;--purple:#a78bfa}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.widget{width:100%;max-width:290px;padding:5px;margin:0 auto}
.streak{display:flex;align-items:center;gap:7px;padding:0 2px 8px}
.label{font-size:11px;font-weight:650;color:var(--muted)}
.number{font-size:23px;line-height:1;font-weight:750;letter-spacing:-.04em;color:var(--pink)}
.unit{font-size:10px;color:var(--muted)}
.habits{display:grid;gap:5px}
.habit{min-height:34px;display:flex;align-items:center;gap:9px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.habit.done{border-color:#68405f;background:#211827}
input{appearance:none;-webkit-appearance:none;width:15px;height:15px;flex:0 0 15px;margin:0;border:1.5px solid #806b87;border-radius:4px;background:#120e18;display:grid;place-content:center;cursor:pointer}
input:after{content:"";width:7px;height:4px;border:solid #170f1b;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0)}
input:checked{border-color:var(--pink);background:var(--pink)}
input:checked:after{transform:rotate(-45deg) scale(1)}
input:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.name{font-size:11px;font-weight:550;line-height:1.2}
.habit.done .name{color:#cbb9ce}
@media(prefers-reduced-motion:no-preference){.habit,input:after{transition:background .15s,border-color .15s,transform .15s}}
</style>
</head>
<body>
<main class="widget" id="habit-widget">
  <div class="streak"><span class="label">Current streak</span><span class="number" id="streak">0</span><span class="unit">days</span></div>
  <section class="habits" id="habits" aria-label="Daily habits">
    <label class="habit"><input type="checkbox" data-name="Scheduled WakeUp"><span class="name">Scheduled WakeUp</span></label>
    <label class="habit"><input type="checkbox" data-name="Coffee + News"><span class="name">Coffee + News</span></label>
    <label class="habit"><input type="checkbox" data-name="Meditate"><span class="name">Meditate</span></label>
    <label class="habit"><input type="checkbox" data-name="Sups"><span class="name">Sups</span></label>
    <label class="habit"><input type="checkbox" data-name="Evening Care"><span class="name">Evening Care</span></label>
  </section>
</main>
<script>
(()=>{
 const KEY="notion-habit-tracker-v1";
 const names=["Scheduled WakeUp","Coffee + News","Meditate","Sups","Evening Care"];
 const keyFor=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 const today=keyFor(new Date());
 let data={days:{}};
 try{const saved=JSON.parse(localStorage.getItem(KEY)||"{}");if(saved&&saved.days&&typeof saved.days==="object")data=saved;}catch(e){}
 if(!data.days)data.days={};
 if(!data.days[today])data.days[today]={};
 const boxes=[...document.querySelectorAll("#habits input")];
 const complete=day=>names.every(n=>data.days[day]?.[n]===true);
 function streak(){
   let count=0;const d=new Date(); 
   if(!complete(keyFor(d)))d.setDate(d.getDate()-1);
   while(count<3660&&complete(keyFor(d))){count++;d.setDate(d.getDate()-1);}
   return count;
 }
 function render(){
   boxes.forEach(box=>{box.checked=data.days[today][box.dataset.name]===true;box.closest(".habit").classList.toggle("done",box.checked);});
   document.getElementById("streak").textContent=String(streak());
 }
 boxes.forEach(box=>box.addEventListener("change",()=>{
   data.days[today][box.dataset.name]=box.checked;
   try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
   render();
 }));
 render();
})();
</script>
</body>
</html>
